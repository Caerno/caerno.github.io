about.text:
  n: 27
  ru:
    v:
      - - 'Мне интересны задачи, где сначала нужно разобраться в том, что на самом деле происходит: в данных, коде, системе или процессе. Поэтому среди моих работ есть и LLM-продукт, и анализ данных, и открытые исследования, и код для Википедии.'
        - 'В разных проектах повторяется один подход: найти проверяемые факты, отделить их от предположений и довести результат до рабочего состояния. В финансовом и количественном анализе для споров и расследований это были цифры и документы; в ML — данные, тесты и поведение модели.'
        - 'Я работаю на стыке анализа и инженерии: могу разбираться в незнакомой области, строить решение вокруг данных и оставлять после работы код, тесты или открытый набор данных.'
      - - В моих проектах постоянно встречаются задачи, где нельзя просто взять готовый ответ. Нужно сначала понять, что происходит, затем собрать способ это проверить и только после этого делать вывод.
        - 'Это одинаково работает для финансового анализа, машинного обучения, Википедии и собственных исследований: данные должны быть понятны, вывод — проверяем, а результат — пригоден для дальнейшей работы.'
        - Поэтому я совмещаю анализ данных с инженерной частью задачи.
      - - 'За разными кейсами стоят разные области, но задача часто одна: превратить большой или сырой массив информации в то, на что можно опереться.'
        - Иногда это работающий продукт, иногда открытый датасет, иногда код, который используется на миллионах страниц, иногда исследование, которое можно повторить по исходным данным.
        - Мне близка работа, где результат можно открыть, проверить и использовать дальше.
    pick: 0
