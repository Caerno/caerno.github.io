tagline: Reconstructing financial facts from fragmented records, complex ownership structures and disputed transactions.
points: |-
  Identified suspicious transactions at a major real estate developer that caused more than $100 million in damage.
  Found a buyer for a bankrupt electric steel plant. The plant was sold as a going concern for more than $1 million, keeping production running and jobs in place.
  Managed insolvency, restructuring and asset-transfer projects, including an asset exchange between two multibillion-dollar metals groups.
blocks:
  - label: What I saw
    text: Fraud shows up as a break in the usual pattern. So you first reconstruct how this particular business normally works, and only then compare that picture against reality.
  - label: What I built
    text: "Sixteen years of working with data: financial analytics and expert work in companies I was seeing for the first time. I reconstructed money flows, untangled ownership structures and wrote conclusions that could survive hostile scrutiny. In parallel, eight years as part-time general manager of an audit and consulting firm."
  - label: Result
    text: "One approach underlies all of it: get into an unfamiliar domain, understand how it works, find the anomaly. After 2022 I have applied the same approach to data systems instead of ledgers."
