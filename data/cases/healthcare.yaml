title:
  - Health­care
tagline: Built and launched a clinic-facing LLM assistant in five months, from initial requirements to production.
points: |-
  Designed the assistant around clinic workflows. It retrieves information from the clinic's knowledge base (RAG), identifies the patient's request and collects appointment details. Patients can contact it through messaging apps, web chat or email; requests are forwarded to clinic administrators.
  Built a pre-release evaluation pipeline with simulated patients and an LLM judge, covering 50+ scenarios and 8,800+ automated tests. Tracked the cost and latency of every dialogue against the service-level targets.
  Launched the system and oversaw its production operation. Around 92% of patient conversations were handled without human intervention. Developed the unit economics and financial model to support investor discussions.
blocks:
  - label: What I saw
    text: A patient dialogue is a state machine that speaks natural language. Booking is structured data collection; empathy is how that process looks to the patient. Separate the two and quality becomes something you can test instead of eyeball.
  - label: What I built
    text: 'In five months I took the platform from an empty repository to production with a live clinic. It has deterministic dialogue orchestration, an LLM, RAG over clinic knowledge, a booking state machine and operator handoff. Separately I built a behavioural regression rig: simulated patients talk to the bot and a calibrated LLM judge scores the behaviour they produce (5,300+ automated tests, judge on a local GPU at zero cloud cost). The cost of every model call is visible end to end.'
  - label: Result
    text: Clinics run in production, real patients book through the bot, and dialogue behaviour is tested systematically before a release. The unit economics of the product are modelled for investor negotiations.
  - label: Stack
    text: async Python, PostgreSQL, RAG over a clinic knowledge base, Kubernetes, Prometheus · Grafana · Loki, local GPU inference for the judge
